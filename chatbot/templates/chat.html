{% load static %}
<!DOCTYPE html>
<html>

<head>
<title>Osho AI Chatbot</title>
<script src="https://cdn.jsdelivr.net/npm/particles.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>

@import url("https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap");

:root{
--bg:#060f24;
--panel:#0b1734cc;
--panel-border:#25406f;
--text:#eaf2ff;
--muted:#9db3d6;
--accent:#22c55e;
--accent-2:#38bdf8;
}


body{
margin:0;
font-family:Manrope, "Segoe UI", sans-serif;
background:radial-gradient(circle at 20% 0%, #12244d 0%, #060f24 52%);
color:var(--text);
display:flex;
height:100vh;
overflow:hidden;
}

#language{
padding:8px;
border-radius:6px;
margin-right:10px;
background:#1e293b;
color:white;
}

#particles-js{
position:fixed;
width:100%;
height:100%;
z-index:-1;
top:0;
left:0;
background:#0f172a;
}

/* Sidebar */

.sidebar{
width:250px;
background:linear-gradient(180deg, #020617f0, #081634f0);
border-right:1px solid var(--panel-border);
padding:20px;
overflow-y:auto;
backdrop-filter:blur(8px);
}

.sidebar h2{
font-size:22px;
margin-bottom:20px;
letter-spacing:.2px;
}

.history{
font-size:14px;
color:#cbd5f5;
margin-bottom:10px;
cursor:pointer;
background:#0f1d3d;
border:1px solid #2c446f;
border-radius:10px;
padding:8px;
line-height:1.35;
transition:transform .2s ease, border-color .2s ease;
}

.history:hover{
transform:translateY(-1px);
border-color:#3d64a1;
}

.sidebar-section-title{
font-size:13px;
color:#93c5fd;
margin:16px 0 8px;
letter-spacing:.3px;
}

.fav-item{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:8px;
padding:10px;
border:1px solid #2c446f;
border-radius:10px;
margin-bottom:8px;
background:#0f1d3d;
box-shadow:0 6px 18px rgba(0,0,0,.2);
}

.fav-body{
flex:1;
cursor:pointer;
}

.fav-preview{
font-size:13px;
color:#dbeafe;
line-height:1.4;
word-break:break-word;
}

.fav-full{
display:none;
font-size:13px;
color:#e2e8f0;
line-height:1.45;
word-break:break-word;
border-top:1px dashed #334155;
padding-top:8px;
margin-top:8px;
}

.fav-text{
font-size:13px;
color:#dbeafe;
line-height:1.4;
word-break:break-word;
}

.fav-remove{
background:transparent;
border:none;
color:#fca5a5;
padding:0;
font-size:14px;
cursor:pointer;
transition:transform .2s ease;
}

.fav-remove:hover{
transform:scale(1.08);
}

.fav-empty{
font-size:12px;
color:#94a3b8;
}

#favorites{
max-height:48vh;
overflow-y:auto;
padding-right:4px;
}

.sidebar::-webkit-scrollbar,
#favorites::-webkit-scrollbar{
width:7px;
}

.sidebar::-webkit-scrollbar-thumb,
#favorites::-webkit-scrollbar-thumb{
background:#1e3a8a;
border-radius:8px;
}

/* Main */

.main{
flex:1;
display:flex;
flex-direction:column;
background:linear-gradient(180deg, rgba(10,22,50,.55), rgba(6,15,36,.7));
}

.header{
padding:18px;
background:linear-gradient(90deg, #0a1735ea, #0e1f47ea);
border-bottom:1px solid var(--panel-border);
font-size:24px;
font-weight:800;
letter-spacing:.4px;
text-align:center;
text-shadow:0 0 14px rgba(56,189,248,.35);
}

/* Chat */

.chat-container{
flex:1;
overflow-y:auto;
padding:25px;
display:flex;
flex-direction:column;
gap:12px;
}

.message-row{
display:flex;
align-items:flex-start;
gap:10px;
animation:messageIn .35s ease;
}

@keyframes messageIn{
from{opacity:0;transform:translateY(8px)}
to{opacity:1;transform:translateY(0)}
}

.avatar{
width:35px;
height:35px;
border-radius:50%;
background:linear-gradient(135deg, #1d4ed8, #38bdf8);
display:flex;
align-items:center;
justify-content:center;
font-size:18px;
box-shadow:0 6px 18px rgba(30,64,175,.35);
}

.bot-avatar{
background:linear-gradient(135deg, #7c3aed, #2563eb);
}

.message{
padding:12px 16px;
border-radius:14px;
max-width:60%;
line-height:1.5;
box-shadow:0 10px 22px rgba(0,0,0,.2);
}

.user{
background:linear-gradient(135deg, #2563eb, #38bdf8);
margin-left:auto;
}

.bot{
background:#16284a;
border:1px solid #2c446f;
}

/* Input */

.input-area{
display:flex;
padding:15px;
background:#081632f0;
border-top:1px solid var(--panel-border);
gap:10px;
}

input{
flex:1;
padding:12px;
border:1px solid #2d4b7b;
border-radius:10px;
background:#111f42;
color:white;
outline:none;
transition:border-color .2s ease, box-shadow .2s ease;
}

input:focus{
border-color:#3b82f6;
box-shadow:0 0 0 3px rgba(59,130,246,.2);
}

button{
padding:10px 16px;
border:none;
border-radius:10px;
background:linear-gradient(135deg, #22c55e, #16a34a);
color:white;
cursor:pointer;
font-weight:700;
transition:transform .2s ease, filter .2s ease;
}

button:hover{
transform:translateY(-1px);
filter:brightness(1.08);
}

/* typing dots */

.typing{
display:flex;
gap:4px;
padding:10px;
}

.dot{
width:6px;
height:6px;
background:white;
border-radius:50%;
animation:blink 1.2s infinite;
}

.dot:nth-child(2){animation-delay:.2s;}
.dot:nth-child(3){animation-delay:.4s;}

@keyframes blink{
0%,80%,100%{opacity:.2}
40%{opacity:1}
}

.copy{
margin-left:10px;
font-size:12px;
cursor:pointer;
opacity:.7;
}

.copy:hover{
opacity:1;
}

.audio-control{
display:inline-block;
margin-left:10px;
}
#splash{
position:fixed;
width:100%;
height:100%;
background:#020617;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:999;
animation:splashFadeOut .6s ease 2.4s forwards;
}

@keyframes splashFadeOut{
to{
opacity:0;
visibility:hidden;
pointer-events:none;
}
}

#splash img{
width:220px;
border-radius:50%;
margin-bottom:20px;
}

#splash h1{
font-size:28px;
}
.osho-aura{
position:relative;
display:flex;
justify-content:center;
align-items:center;
}

.osho-aura img{
width:220px;
border-radius:50%;
z-index:2;
}

/* glowing aura */

.osho-aura::before{

content:"";

position:absolute;

width:280px;
height:280px;

border-radius:50%;

background:radial-gradient(circle,
rgba(255,255,255,0.6),
rgba(147,51,234,0.4),
transparent 70%);

animation:auraGlow 4s infinite ease-in-out;

z-index:1;

}

@keyframes auraGlow{

0%{
transform:scale(1);
opacity:.6;
}

50%{
transform:scale(1.2);
opacity:1;
}

100%{
transform:scale(1);
opacity:.6;
}

}

@media (max-width: 900px){
body{
flex-direction:column;
height:100dvh;
overflow:auto;
}

.sidebar{
width:100%;
max-height:36vh;
border-right:none;
border-bottom:1px solid var(--panel-border);
}

.main{
min-height:64vh;
}

.message{
max-width:82%;
}

.header{
font-size:20px;
}

.input-area{
padding:12px;
}
}

</style>

</head>

<body>
    <div id="particles-js"></div>
    <audio id="meditationSound" loop>
  <source src="{% static 'meditation.mp3' %}" type="audio/mpeg">
</audio>

    <div id="splash">

<div class="osho-aura">

<img src="{% static 'osho.jpg' %}">

</div>

<h1>🙏 Namaste</h1>

</div>

<div class="sidebar">

<h2>🧘 Osho Chats</h2>

<div class="sidebar-section-title">Recent Chats</div>
<div id="history"></div>

<div class="sidebar-section-title">Favorites</div>
<div id="favorites"></div>

</div>

<div class="main">

<div class="header">
Osho AI Chatbot
</div>
<div id="quoteBox" style="text-align:center;padding:10px;font-style:italic;color:#cbd5f5;"></div>
<div id="meditationBox" style="text-align:center;padding:15px">

<h3>🧘 Meditation Timer</h3>

<button onclick="startMeditation(5)">5 min</button>
<button onclick="startMeditation(10)">10 min</button>
<button onclick="startMeditation(15)">15 min</button>

<p id="timerText"></p>

</div>

<div class="chat-container" id="chatbox"></div>

<div class="input-area">
    <select id="language">
<option value="auto">Auto Detect</option>
<option value="English">English</option>
<option value="Hindi">Hindi</option>
</select>

<input id="message" placeholder="Ask about life...">

<button id="voiceBtn" onclick="startVoice()">🎤</button>

<button onclick="sendMessage()">Send</button>

</div>

</div>

<script>

let historyDiv=document.getElementById("history")
let favoritesDiv=document.getElementById("favorites")
let activeSpeech=null
let activeSpeechButton=null

function getFavs(){
return JSON.parse(localStorage.getItem("oshoFav")) || []
}

function setFavs(favs){
localStorage.setItem("oshoFav", JSON.stringify(favs))
}

function renderFavs(){
let favs=getFavs()

if(favs.length===0){
favoritesDiv.innerHTML=`<div class="fav-empty">No favorites yet.</div>`
return
}

favoritesDiv.innerHTML=""

favs.slice().reverse().forEach((text, index)=>{
let originalIndex=favs.length-1-index
let item=document.createElement("div")
item.className="fav-item"

let previewText=text.length>90 ? text.substring(0,90)+"..." : text

item.innerHTML=`
<div class="fav-body" onclick="toggleFav(this)">
<div class="fav-preview"></div>
<div class="fav-full"></div>
</div>
<button class="fav-remove" onclick="removeFav(${originalIndex})" title="Remove">✖</button>`

item.querySelector(".fav-preview").innerText=previewText
item.querySelector(".fav-full").innerText=text
favoritesDiv.appendChild(item)
})
}

function toggleFav(el){
let preview=el.querySelector(".fav-preview")
let full=el.querySelector(".fav-full")
let isOpen=full.style.display==="block"

full.style.display=isOpen ? "none" : "block"
preview.style.display=isOpen ? "block" : "none"
}

function removeFav(index){
let favs=getFavs()
favs.splice(index,1)
setFavs(favs)
renderFavs()
}

function extractMessageText(el){
let node=el.parentElement.cloneNode(true)
node.querySelectorAll(".copy").forEach(btn=>btn.remove())
return node.innerText.trim()
}

function addHistory(text){

if(historyDiv.children.length>0) return

let item=document.createElement("div")

item.className="history"

item.innerText=text.substring(0,30)

historyDiv.prepend(item)

}

function sendMessage(){

let message=document.getElementById("message").value

if(message==="") return

let chatbox=document.getElementById("chatbox")

chatbox.innerHTML+=`
<div class="message-row" style="justify-content:flex-end">
<div class="message user">${message}</div>
<div class="avatar">🧑</div>
</div>`

addHistory(message)

document.getElementById("message").value=""

let typing=`
<div class="message-row">
<div class="avatar bot-avatar">🧘</div>
<div class="message bot">
<div class="typing">
<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>
</div>
</div>
</div>`

chatbox.innerHTML+=typing

chatbox.scrollTop=chatbox.scrollHeight

let lang=document.getElementById("language").value

fetch(`/get/?message=${encodeURIComponent(message)}&lang=${lang}`)

.then(response=>response.json())

.then(data=>{

document.querySelector(".typing").parentElement.innerHTML=
marked.parse(data.response)+
`<span class="copy" onclick="copyText(this)">📋</span>
<span class="copy" onclick="saveFav(this)">⭐</span>
<span class="copy audio-control" onclick="toggleSpeech(this)">▶ Play</span>`

chatbox.scrollTop=chatbox.scrollHeight

})

}

function copyText(el){

let text=el.parentElement.innerText

navigator.clipboard.writeText(text)

el.innerText="✔"

setTimeout(()=>{el.innerText="📋"},1000)

}

document.getElementById("message")
.addEventListener("keypress",function(e){

if(e.key==="Enter") sendMessage()

})

function stopActiveSpeech(){
if(activeSpeech){
window.speechSynthesis.cancel()
activeSpeech=null
}

if(activeSpeechButton){
activeSpeechButton.innerText="▶ Play"
activeSpeechButton=null
}
}

function createSpeech(text){
let speech = new SpeechSynthesisUtterance(text)

let selectedLang = document.getElementById("language").value

if(selectedLang === "Hindi" || /[\u0900-\u097F]/.test(text)){
speech.lang = "hi-IN"
}else{
speech.lang = "en-US"
}

let voices = window.speechSynthesis.getVoices()

let voice = voices.find(v =>
v.lang && v.lang.toLowerCase().startsWith(speech.lang.slice(0,2).toLowerCase())
)

if(!voice && speech.lang === "en-US"){
voice = voices.find(v =>
v.name.toLowerCase().includes("male") ||
v.name.toLowerCase().includes("david") ||
v.name.toLowerCase().includes("daniel")
)
}

speech.voice = voice || voices[0]
speech.rate = 0.85
speech.pitch = 0.8

return speech
}

function toggleSpeech(el){
if(activeSpeechButton===el && (window.speechSynthesis.speaking || window.speechSynthesis.paused)){
if(window.speechSynthesis.paused){
window.speechSynthesis.resume()
el.innerText="⏸ Pause"
}else{
window.speechSynthesis.pause()
el.innerText="▶ Play"
}
return
}

stopActiveSpeech()

let text = extractMessageText(el)
if(text==="") return

let speech = createSpeech(text)
activeSpeech=speech
activeSpeechButton=el
el.innerText="⏸ Pause"

speech.onend=function(){
stopActiveSpeech()
}

speech.onerror=function(){
stopActiveSpeech()
}

window.speechSynthesis.speak(speech)
}

function startVoice(){

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition

if(!SpeechRecognition){
alert("Voice input is not supported in this browser. Please use Chrome on HTTPS.")
return
}

const voiceBtn=document.getElementById("voiceBtn")
voiceBtn.innerText="🎙..."

const recognition=new SpeechRecognition()

recognition.lang="en-US"
recognition.interimResults=false
recognition.maxAlternatives=1

recognition.onstart=function(){
voiceBtn.innerText="🎙..."
}

recognition.onresult=function(event){

let voiceText=event.results[0][0].transcript

document.getElementById("message").value=voiceText

voiceBtn.innerText="🎤"

sendMessage()

}

recognition.onerror=function(event){
voiceBtn.innerText="🎤"
if(event.error==="not-allowed"){
alert("Microphone permission denied. Please allow microphone access in browser settings.")
return
}
if(event.error==="no-speech"){
alert("No speech detected. Please speak clearly and try again.")
return
}
alert("Voice input failed: "+event.error)
}

recognition.onend=function(){
voiceBtn.innerText="🎤"
}

recognition.start()

}
setTimeout(()=>{

document.getElementById("splash").style.display="none"

},2500)
document.body.addEventListener("click",function(){

let sound=document.getElementById("meditationSound")

sound.play()

})
particlesJS("particles-js", {

particles: {

number: {
value: 80
},

color: {
value: "#ffffff"
},

shape: {
type: "circle"
},

opacity: {
value: 0.5
},

size: {
value: 3
},

line_linked: {
enable: true,
distance: 150,
color: "#ffffff",
opacity: 0.2
},

move: {
enable: true,
speed: 1
}

}

});

document.addEventListener("click", function () {
    let sound = document.getElementById("meditationSound");
    if (sound.paused) {
        sound.play();
    }
});

fetch("/quote/")
.then(res=>res.json())
.then(data=>{
document.getElementById("quoteBox").innerText="🧘 "+data.quote
})
.catch(()=>{
document.getElementById("quoteBox").innerText="🧘 Stay present. Breathe and begin."
})

function saveFav(el){

let text = extractMessageText(el)

if(text==="") return

let favs = JSON.parse(localStorage.getItem("oshoFav")) || []

if(favs.includes(text)){
el.innerText="⭐"
return
}

favs.push(text)

localStorage.setItem("oshoFav", JSON.stringify(favs))

el.innerText="✅"

renderFavs()

}

function startMeditation(minutes){

let total = minutes*60

let timer = setInterval(()=>{

let min = Math.floor(total/60)
let sec = total%60

document.getElementById("timerText").innerText =
"⏳ "+min+":"+sec

total--

if(total<0){

clearInterval(timer)

document.getElementById("timerText").innerText =
"✨ Meditation Complete"

playMeditationCompletionAlert()

}

},1000)

}

function playMeditationCompletionAlert(){
let sound=document.getElementById("meditationSound")

if(sound){
sound.pause()
sound.currentTime=0
sound.loop=false

let playPromise=sound.play()
if(playPromise && typeof playPromise.catch === "function"){
playPromise.catch(()=>{
playBeepFallback()
})
}

setTimeout(()=>{
sound.pause()
sound.currentTime=0
sound.loop=true
},4000)

return
}

playBeepFallback()
}

function playBeepFallback(){
let AudioContextClass = window.AudioContext || window.webkitAudioContext
if(!AudioContextClass) return

let ctx = new AudioContextClass()
let beepTimes=[0,0.35,0.7]

beepTimes.forEach((offset)=>{
let osc=ctx.createOscillator()
let gain=ctx.createGain()
osc.type="sine"
osc.frequency.value=880
gain.gain.setValueAtTime(0.0001, ctx.currentTime + offset)
gain.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + offset + 0.02)
gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + offset + 0.22)
osc.connect(gain)
gain.connect(ctx.destination)
osc.start(ctx.currentTime + offset)
osc.stop(ctx.currentTime + offset + 0.24)
})
}

renderFavs()
</script>

</body>
</html>
